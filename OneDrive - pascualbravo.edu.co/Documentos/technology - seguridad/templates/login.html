<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login -  Software Technology</title>
    <style>
        /* Reset y configuración base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Título de la empresa con animación original */
        h1 {
            text-align:center;
            margin-right: 40px;
            font-weight: bold;
            font-size: 2.5em;
            color: #e9f4f3;
            text-shadow: 0 0 10px #75e4f8, 0 0 20px #798be8, 0 0 40px #da6efe;
            position: relative;
            animation: mover-arriba-abajo 3s ease-in-out infinite alternate;
            padding-top: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes mover-arriba-abajo {
            0% {
                top: 0;
            }
            100% {
                top: 60px;
            }
        }

        @keyframes deslizar-abajo {
            from {
                top: -50px;
                opacity: 0;
            }
            to {
                top: 0;
                opacity: 1;
            }
        }

        /* Contenedor principal del login */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
            animation: deslizar-abajo 1s ease-out 0.5s both;
        }

        /* Tarjeta del formulario */
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 50px 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 100%;
            max-width: 450px;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        /* Encabezado del formulario */
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-icon {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 15px;
            display: block;
        }

        .login-title {
            color: #333;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #666;
            font-size: 1rem;
        }

        /* Estilos del formulario */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .input-group {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
            color: #333;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .form-input::placeholder {
            color: #999;
            transition: all 0.3s ease;
        }

        .form-input:focus::placeholder {
            opacity: 0.7;
            transform: translateX(5px);
        }

        /* Botón de ingreso */
        .submit-button {
            padding: 15px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .submit-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            background: linear-gradient(45deg, #5a6fd8, #6b42a0);
        }

        .submit-button:hover::before {
            left: 100%;
        }

        .submit-button:active {
            transform: translateY(0);
        }

        /* Efectos decorativos */
        .decorative-circles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .circle:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .circle:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 70%;
            right: 10%;
            animation-delay: 2s;
        }

        .circle:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 50%;
            left: 5%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
                opacity: 0.6;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
                text-align: center;
                margin-right: 0;
                padding: 20px;
            }

            .login-card {
                padding: 30px 25px;
                margin: 20px;
                border-radius: 20px;
            }

            .login-icon {
                font-size: 3rem;
            }

            .login-title {
                font-size: 1.5rem;
            }

            @keyframes mover-arriba-abajo {
                0% {
                    top: 0;
                }
                100% {
                    top: 30px;
                }
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 10px;
            }

            .login-card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .form-input, .submit-button {
                padding: 12px 15px;
            }
        }

        /* Animación de carga para el formulario */
        .form-input, .submit-button {
            animation: slideIn 0.6s ease-out forwards;
            opacity: 0;
            transform: translateX(-30px);
        }

        .form-input:nth-child(1) { animation-delay: 0.8s; }
        .form-input:nth-child(2) { animation-delay: 1s; }
        .submit-button { animation-delay: 1.2s; }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <!-- Círculos decorativos -->
    <div class="decorative-circles">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Título de la empresa -->
    <h1>&ensp;&ensp;Software <br>&ensp;&ensp;Technology</h1>

    <!-- Contenedor del login -->
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <span class="login-icon">🔐</span>
                <h2 class="login-title">Iniciar Sesión</h2>
                <p class="login-subtitle">Accede a tu panel de control</p>
            </div>

            <form method="POST" class="login-form">
                <div class="input-group">
                    <input name="username" placeholder="Usuario" class="form-input" required>
                </div>
                <div class="input-group">
                    <input name="password" placeholder="Contraseña" type="password" class="form-input" required>
                </div>
                <button type="submit" class="submit-button" href="dashboard.html">
                    Ingresar
                </button>
            </form>
        </div>
    </div>
</body>
</html>
